algorithms:
  - id: cpu_seq
    label: CPU sequential
    scheduler: cpu_only
    cpu_backend: sequential
    requires_cuda: false
    uses_cpu: true
    uses_gpu: false
    supports_multi_gpu: false
    tunables: [reuse_count]
    role: reference_baseline

  - id: cpu_omp
    label: CPU OpenMP reduction
    scheduler: cpu_only
    cpu_backend: openmp
    requires_cuda: false
    uses_cpu: true
    uses_gpu: false
    supports_multi_gpu: false
    tunables: [reuse_count]
    role: cpu_baseline

  - id: cpu_omp_simd
    label: CPU OpenMP + SIMD reduction
    scheduler: cpu_only
    cpu_backend: openmp_simd
    requires_cuda: false
    uses_cpu: true
    uses_gpu: false
    supports_multi_gpu: false
    tunables: [reuse_count]
    role: strong_cpu_baseline

  - id: cpu_omp_simd_file_stream
    label: CPU OpenMP + SIMD streamed from file
    scheduler: cpu_only
    cpu_backend: openmp_simd
