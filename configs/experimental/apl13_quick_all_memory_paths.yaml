# QUICK EXPLORATORY CAMPAIGN FOR APL13 ONLY.
# Purpose: validate every new single-device memory/data-access policy on BOTH RTX 8000 GPUs.
# This is not a final thesis campaign. The 1-GPU runs are retained only as same-machine
# baselines for later 1-vs-2 GPU scaling analysis; the dual-GPU execution itself is covered
# by apl13_quick_all_topologies.yaml.

output_dir: results/apl13_quick_all_memory_paths
dataset_cache_dir: .prbench/datasets
worker: build/prbench-memory-path-worker
file_stream_worker: build/prbench-file-stream-worker

host_resident_ram_fraction: 0.70
warmup: 1
repetitions: 2
blocks: 2
randomization_seed: 20260921

# Validate both physical GPUs independently so we do not assume identical behavior.
gpu_ids: [0, 1]

# Sum is enough here: sum/min/max and all dtypes were already validated in smoke campaigns.
operations: [sum]

# Check one-shot and a small amount of data reuse without making this exploratory run long.
reuse_counts: [1, 4]

# 1,048,576 float32 elements = 4 MiB transfer chunk.
chunk_elements: [1048576]
pipeline_streams: [2]

# CUDA Graphs are currently implemented for these policies only.
cuda_graph_modes:
  - explicit_sync
  - device_resident

include_device_resident_diagnostic: true
include_gpudirect_storage_probe: true

# HMM remains in the matrix intentionally. On the current apl13 configuration it should
# be recorded as SKIPPED (PageableMemoryAccess=0 / Addressing Mode=None), which verifies
# capability gating. GDS is diagnosed separately and is not mixed into this host-memory study.
modes:
  - explicit_sync
  - chunked_sync
  - async_pipeline
  - zero_copy
  - managed_fault
  - managed_prefetch
  - managed_advised
  - hmm_system

# Small, geometric sweep. Largest file is only ~40 MB, so the whole campaign remains short.
datasets:
  - size: 100000
    dtype: float32
    distribution: uniform
    seed: 52001
    low: -1.0
    high: 1.0
    quantization:
      mode: binary_fraction
      bits: 8

  - size: 1000000
    dtype: float32
    distribution: uniform
    seed: 52001
    low: -1.0
    high: 1.0
    quantization:
      mode: binary_fraction
      bits: 8

  - size: 10000000
    dtype: float32
    distribution: uniform
    seed: 52001
    low: -1.0
    high: 1.0
    quantization:
      mode: binary_fraction
      bits: 8
