# QUICK EXPLORATORY CAMPAIGN FOR APL13 ONLY.
# Purpose: exercise the two-GPU machine aggressively while keeping runtime short.
# Main interest: GPU0+GPU1 and CPU+GPU0+GPU1. Single-GPU groups are retained only as
# same-machine baselines for scaling and asymmetry checks.

output_dir: results/apl13_quick_all_topologies
dataset_cache_dir: .prbench/datasets
worker: build/prbench-topology-stream-worker

warmup: 1
repetitions: 2
blocks: 2
randomization_seed: 20260922
host_resident_ram_fraction: 0.70
numa_strict: false

operations: [sum]

modes:
  - pinned_direct
  - multi_gpu_async
  - hybrid_cpu_gpu

# file_stream is included deliberately even for small files so the exact code path later
# used for N>RAM is exercised now. pinned_direct is automatically limited to host_resident.
storage_policies:
  - host_resident
  - file_stream

# Keep both 1-GPU baselines, but the [0,1] topology is the principal apl13 case.
gpu_sets:
  - [0]
  - [1]
  - [0, 1]

# Current apl13 topology snapshot reports both RTX 8000 devices on NUMA node 0.
# The current build may report numa_applied=false if libnuma development support is absent.
gpu_numa_nodes:
  0: 0
  1: 0

# Small transfer chunk and two streams keep overhead visible while the run remains short.
chunk_elements: [1048576]
pipeline_streams: [2]

# Hybrid paths exercise CPU+GPU0, CPU+GPU1 and, most importantly, CPU+GPU0+GPU1.
cpu_threads: [8]
cpu_fractions: [0.25, 0.50]

datasets:
  - size: 100000
    dtype: float32
    distribution: uniform
    seed: 52001
    low: -1.0
    high: 1.0
    quantization:
      mode: binary_fraction
      bits: 8

  - size: 1000000
    dtype: float32
    distribution: uniform
    seed: 52001
    low: -1.0
    high: 1.0
    quantization:
      mode: binary_fraction
      bits: 8

  - size: 10000000
    dtype: float32
    distribution: uniform
    seed: 52001
    low: -1.0
    high: 1.0
    quantization:
      mode: binary_fraction
      bits: 8
