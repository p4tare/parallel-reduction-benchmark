# Experimental GPUDirect Storage validation only.
# This is intentionally separate from host-resident CPU/GPU break-even ranking.
output_dir: results/gds_smoke
dataset_cache_dir: .prbench/datasets
worker: build/prbench-gds-worker
blocks: 1
randomization_seed: 20260918
gpu_ids: [0]
operations: [sum, min, max]
chunk_elements: [262144, 1048576]

datasets:
  - size: 1000000
    dtype: float32
    distribution: uniform
    seed: 51201
    low: -1.0
    high: 1.0
    quantization:
      mode: binary_fraction
      bits: 8
