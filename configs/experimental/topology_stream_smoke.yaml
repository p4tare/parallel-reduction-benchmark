# EXPERIMENTAL validation only. Not thesis ranking data.
# Validates direct registered pinned input, concurrent two-GPU streaming,
# CPU+GPU streaming and NUMA-local staging on apl13.
output_dir: results/topology_stream_smoke
dataset_cache_dir: .prbench/datasets
worker: build/prbench-topology-stream-worker

warmup: 1
repetitions: 2
blocks: 1
randomization_seed: 20260919
host_resident_ram_fraction: 0.70
numa_strict: false

operations: [sum, min, max]
modes:
  - pinned_direct
  - multi_gpu_async
  - hybrid_cpu_gpu

# Small smoke test covers both residency semantics. file_stream is intentionally
# tested even though this dataset fits RAM so the >RAM execution path can be validated.
storage_policies:
  - host_resident
  - file_stream

gpu_sets:
  - [0]
  - [1]
  - [0, 1]

# doctor/topology snapshot for apl13 reports both RTX 8000 devices on NUMA node 0.
# Keep this explicit so the worker can allocate/register staging on the local node.
gpu_numa_nodes:
  0: 0
  1: 0

chunk_elements: [262144]
pipeline_streams: [2]
cpu_threads: [8]
cpu_fractions: [0.25, 0.50]

datasets:
  - size: 1000000
    dtype: float32
    distribution: uniform
    seed: 50911
    low: -1.0
    high: 1.0
    quantization:
      mode: binary_fraction
      bits: 8

  - size: 1000000
    dtype: int64
    distribution: integers
    seed: 50912
    low: -1000000
    high: 1000000
