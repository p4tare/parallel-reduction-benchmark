# V4 INTEGRATION SMOKE — apl13 only.
# Uses the normal prbench config/runner/worker stack. This is not final thesis data.
# Goal: verify old + new algorithms, 1/2 GPU topologies, storage paths, validation,
# energy/telemetry, console progress and unified result files before large campaigns.

output_dir: results/apl13_integrated_smoke_v4
dataset_cache_dir: .prbench/datasets

build:
  build_dir: build
  build_type: Release
  native_cpu_tuning: true
  enable_cuda: "on"
  jobs: null
  cxx_compiler: /usr/bin/g++-13
  cuda_host_compiler: /usr/bin/g++-13

measurement:
  warmup_runs: 1
  scheduler_calibration_repetitions: 3
  scheduler_calibration_bursts: 1
  timing_repetitions: auto
  timing_probe_repetitions: 3
  timing_target_batch_seconds: 0.20
  timing_min_repetitions: 3
  timing_max_repetitions: 30
  cache_rotation_target_bytes: 67108864
  cache_rotation_max_replicas: 4
  energy_batch_repetitions: auto
  energy_target_batch_seconds: 0.50
  energy_min_repetitions: 1
  energy_max_repetitions: 20
  blocks: 1
  randomization_seed: 20260923
  max_dataset_ram_fraction: 0.70
  max_dataset_storage_fraction_of_free: 0.90
  gpu_memory_safety_fraction: 0.80
  thermal_safety_gpu_c: 85
  thermal_safety_cpu_c: 95
  thermal_wait_timeout_s: 300
  worker_event_timeout_s: 1800
  strict_preflight: false
  max_preflight_cpu_load_percent: 15.0
  allow_gpu_graphics_processes: false

energy:
  enable_cpu: true
  enable_gpu: true
  gpu_power_fallback_poll_ms: 50

telemetry:
  enabled: true
  capture_cpu_frequency: true
  capture_cpu_temperature: true
  capture_gpu_state: true
  capture_pre_post_timing: true
  capture_pre_post_energy: true

system_baselines:
  capture_memory_inventory: true
  stream_executable: null
  stream_args: []
  stream_timeout_s: 120

experiments:
  # Old strong baselines run through exactly the same legacy strategies as v3.
  - id: v4_legacy_baselines
    operations: [sum]
    datasets: &small_datasets
      - {size: 1000000, dtype: float32, distribution: uniform, seed: 52001, low: -1.0, high: 1.0, quantization: {mode: binary_fraction, bits: 8}}
      - {size: 10000000, dtype: float32, distribution: uniform, seed: 52001, low: -1.0, high: 1.0, quantization: {mode: binary_fraction, bits: 8}}
    algorithms:
      - {id: cpu_omp_simd}
      - {id: gpu_cub}
      - {id: gpu_cub_async, params: {pipeline_streams: 2, pipeline_chunks: 4, pipeline_chunk_elements: 1048576}}
    hardware:
      cpu_core_class: all
      cpu_thread_policy: one_thread_per_core
      gpu_sets: [each]
      gpu_control_mode: dedicated
      memory_policy: interleave
      gpu_staging_numa: auto

  # Every host-resident single-GPU memory path is validated independently on GPU0/GPU1.
  - id: v4_memory_paths_each_gpu
    operations: [sum]
    datasets: *small_datasets
    algorithms:
      - {id: gpu_cub_chunked, params: {chunk_size: 1048576, reuse_count: [1, 4]}}
      - {id: gpu_cub_pinned_direct, params: {chunk_size: 1048576, reuse_count: [1, 4]}}
      - {id: gpu_cub_zero_copy, params: {reuse_count: [1, 4]}}
      - {id: gpu_cub_managed_fault, params: {reuse_count: [1, 4]}}
      - {id: gpu_cub_managed_prefetch, params: {reuse_count: [1, 4]}}
      - {id: gpu_cub_managed_advised, params: {reuse_count: [1, 4]}}
      - {id: gpu_cub_hmm, params: {reuse_count: 1}}
      - {id: gpu_cub, params: {reuse_count: 4, use_cuda_graphs: true}}
      - {id: gpu_cub_device_resident, params: {reuse_count: [1, 4], use_cuda_graphs: true}}
    hardware:
      cpu_core_class: all
      cpu_thread_policy: one_thread_per_core
      gpu_sets: [each]
      gpu_control_mode: dedicated
      memory_policy: interleave
      gpu_staging_numa: auto

  # Same-machine topology scaling: GPU0, GPU1 and both GPUs.
  - id: v4_host_topologies
    operations: [sum]
    datasets: *small_datasets
    algorithms:
      - {id: hybrid_static_equal_async, params: {pipeline_streams: 2, pipeline_chunks: 4, pipeline_chunk_elements: 1048576}}
    hardware:
      cpu_core_class: all
      cpu_thread_policy: one_thread_per_core
      gpu_sets: [0, 1, [0, 1]]
      gpu_control_mode: dedicated
      memory_policy: interleave
      gpu_staging_numa: auto

  - id: v4_two_gpu_async
    operations: [sum]
    datasets: *small_datasets
    algorithms:
      - {id: gpu_multi_cub_async, params: {pipeline_streams: 2, pipeline_chunks: 4, pipeline_chunk_elements: 1048576}}
    hardware:
      cpu_core_class: all
      cpu_thread_policy: one_thread_per_core
      gpu_sets: [[0, 1]]
      gpu_control_mode: dedicated
      memory_policy: interleave
      gpu_staging_numa: auto

  # Out-of-core code path is deliberately exercised on small files before >RAM runs.
  - id: v4_cpu_file_stream
    operations: [sum]
    datasets: *small_datasets
    algorithms:
      - {id: cpu_omp_simd_file_stream, params: {chunk_size: 1048576}}
    hardware:
      cpu_core_class: all
      cpu_thread_policy: one_thread_per_core
      gpu_sets: [each]
      gpu_control_mode: dedicated
      memory_policy: default
      gpu_staging_numa: auto

  - id: v4_single_gpu_file_stream
    operations: [sum]
    datasets: *small_datasets
    algorithms:
      - {id: gpu_cub_file_stream, params: {chunk_size: 1048576, reuse_count: 1}}
      - {id: gpu_cub_file_stream_async, params: {pipeline_streams: 2, pipeline_chunk_elements: 1048576, reuse_count: 1}}
    hardware:
      cpu_core_class: all
      cpu_thread_policy: one_thread_per_core
      gpu_sets: [each]
      gpu_control_mode: dedicated
      memory_policy: default
      gpu_staging_numa: auto

  - id: v4_two_gpu_file_stream
    operations: [sum]
    datasets: *small_datasets
    algorithms:
      - {id: gpu_multi_cub_file_stream_async, params: {pipeline_streams: 2, pipeline_chunk_elements: 1048576}}
    hardware:
      cpu_core_class: all
      cpu_thread_policy: one_thread_per_core
      gpu_sets: [[0, 1]]
      gpu_control_mode: dedicated
      memory_policy: default
      gpu_staging_numa: auto

  - id: v4_hybrid_file_stream
    operations: [sum]
    datasets: *small_datasets
    algorithms:
      - {id: hybrid_file_stream_equal, params: {pipeline_streams: 2, pipeline_chunk_elements: 1048576, cpu_fraction: [0.25, 0.50]}}
    hardware:
      cpu_core_class: all
      cpu_thread_policy: one_thread_per_core
      gpu_sets: [0, 1, [0, 1]]
      gpu_control_mode: dedicated
      memory_policy: default
      gpu_staging_numa: auto
