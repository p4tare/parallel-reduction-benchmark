# Experimental smoke test for GPU data-access policies.
# This is validation data only, never thesis ranking data.
output_dir: results/memory_paths_smoke
dataset_cache_dir: .prbench/datasets
worker: build/prbench-memory-path-worker

max_dataset_ram_fraction: 0.70
warmup: 1
repetitions: 2
blocks: 1
randomization_seed: 20260916

gpu_ids: [0]
operations: [sum, min, max]
reuse_counts: [1, 2]
chunk_elements: [262144, 1048576]
pipeline_streams: [2]
include_device_resident_diagnostic: true
include_gpudirect_storage_probe: true

modes:
  - explicit_sync
  - chunked_sync
  - async_pipeline
  - zero_copy
  - managed_fault
  - managed_prefetch
  - managed_advised
  - hmm_system

datasets:
  - size: 1000000
    dtype: float32
    distribution: uniform
    seed: 50901
    low: -1.0
    high: 1.0
    quantization:
      mode: binary_fraction
      bits: 8

  - size: 1000000
    dtype: int64
    distribution: integers
    seed: 50902
    low: -1000000
    high: 1000000
