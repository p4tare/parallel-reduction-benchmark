output_dir: results
build:
  build_dir: build
  build_type: Release
  native_cpu_tuning: true
  enable_cuda: "off"
measurement:
  warmup_runs: 2
  timing_repetitions: 3
  energy_batch_repetitions: 3
  energy_target_batch_seconds: 0.5
  energy_min_repetitions: 3
  energy_max_repetitions: 100
  blocks: 1
  randomization_seed: 12345
  max_dataset_ram_fraction: 0.2
  worker_event_timeout_s: 1800
  thermal_wait_timeout_s: 0
energy:
  enable_cpu: false
  enable_gpu: false
experiments:
  - id: cpu_smoke
    datasets:
      - size: 100000
        dtype: float32
        distribution: symmetric_uniform
        seed: 7
        low: -1.0
        high: 1.0
        quantization:
          mode: binary_fraction
          bits: 8
    algorithms:
      - id: cpu_seq
      - id: cpu_omp
      - id: cpu_omp_simd
    hardware:
      cpu_core_class: all
      cpu_thread_policy: one_thread_per_core
      gpu_sets: []
      gpu_control_mode: dedicated
      memory_policy: default
