# Exploratory parameter tuning only. Do not use these samples as final thesis results.
# Freeze selected parameters after this pilot and use a separate confirmatory configuration.
output_dir: results
build:
  build_dir: build
  build_type: Release
  native_cpu_tuning: true
  enable_cuda: "on"
measurement:
  warmup_runs: 5
  timing_repetitions: 10
  energy_batch_repetitions: 10
  energy_target_batch_seconds: 1.0
  energy_min_repetitions: 10
  energy_max_repetitions: 1000
  blocks: 2
  randomization_seed: 74003
  max_dataset_ram_fraction: 0.65
  thermal_safety_gpu_c: 90
  thermal_safety_cpu_c: 95
  worker_event_timeout_s: 1800
  thermal_wait_timeout_s: 300
energy:
  enable_cpu: false
  enable_gpu: false
experiments:
  - id: tuning_all_operations
    operations: [sum, min, max]
    datasets:
      - {size: 1048576, dtype: float32, distribution: symmetric_uniform, seed: 20260813, low: -1.0, high: 1.0, quantization: {mode: binary_fraction, bits: 8}}
      - {size: 100000000, dtype: float32, distribution: symmetric_uniform, seed: 20260813, low: -1.0, high: 1.0, quantization: {mode: binary_fraction, bits: 8}}
    algorithms:
      - {id: gpu_global_atomic, params: {block_size: [128, 256, 512]}}
      - {id: gpu_shared_naive, params: {block_size: [128, 256, 512]}}
      - {id: gpu_warp_atomic, params: {block_size: [128, 256, 512]}}
      - {id: gpu_two_pass, params: {block_size: [128, 256, 512]}}
      - {id: hybrid_static_profiled_async, params: {pipeline_streams: [2, 4], pipeline_chunks: [8, 16]}}
      - {id: hybrid_dynamic_fixed, params: {chunk_size: [262144, 1048576, 4194304]}}
      - {id: hybrid_dynamic_guided, params: {min_chunk_size: [65536, 262144], guided_factor: [2.0, 4.0]}}
      - id: hybrid_dynamic_adaptive
        params: {min_chunk_size: 65536, max_chunk_size: 16777216, target_chunk_ms: [2.0, 5.0, 10.0], ema_alpha: [0.25, 0.5]}
    hardware:
      cpu_core_class: all
      cpu_thread_policy: all_threads
      gpu_sets: [each, all]
      gpu_control_mode: dedicated
      memory_policy: interleave
