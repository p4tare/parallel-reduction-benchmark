# Validate all first-class reduction operations on CPU, GPU and hybrid paths.
# No energy measurement: this is a correctness/runtime smoke test only.
output_dir: results
build:
  build_dir: build
  build_type: Release
  native_cpu_tuning: true
  enable_cuda: "on"
measurement:
  warmup_runs: 2
  timing_repetitions: 3
  energy_batch_repetitions: 3
  energy_target_batch_seconds: 0.5
  energy_min_repetitions: 3
  energy_max_repetitions: 1000
  blocks: 1
  randomization_seed: 24001
  max_dataset_ram_fraction: 0.2
  thermal_safety_gpu_c: 90
  thermal_safety_cpu_c: 95
  worker_event_timeout_s: 120
  thermal_wait_timeout_s: 60
energy:
  enable_cpu: false
  enable_gpu: false
experiments:
  - id: all_operations_float32
    operations: [sum, min, max]
    datasets:
      - {size: 1048576, dtype: float32, distribution: uniform, seed: 24001, low: -2.0, high: 3.0, quantization: {mode: binary_fraction, bits: 8}}
    algorithms:
      - {id: cpu_seq}
      - {id: cpu_omp}
      - {id: cpu_omp_simd}
      - {id: gpu_global_atomic, params: {block_size: 128}}
      - {id: gpu_shared_naive, params: {block_size: 256}}
      - {id: gpu_warp_atomic, params: {block_size: 256}}
      - {id: gpu_two_pass, params: {block_size: 128}}
      - {id: gpu_cub}
      - {id: hybrid_static_equal}
      - {id: hybrid_static_profiled}
      - {id: hybrid_static_profiled_async, params: {pipeline_streams: 2, pipeline_chunks: 16}}
      - {id: hybrid_dynamic_fixed, params: {chunk_size: 4194304}}
      - {id: hybrid_dynamic_guided, params: {min_chunk_size: 262144, guided_factor: 4.0}}
      - {id: hybrid_dynamic_adaptive, params: {min_chunk_size: 65536, max_chunk_size: 16777216, target_chunk_ms: 2.0, ema_alpha: 0.5}}
    hardware:
      cpu_core_class: all
      cpu_thread_policy: all_threads
      gpu_sets: [each]
      gpu_control_mode: dedicated
      memory_policy: interleave

  - id: integer_atomic_operations
    operations: [sum, min, max]
    datasets:
      - {size: 1048576, dtype: int32, distribution: integers, seed: 24002, low: -100, high: 100}
    algorithms:
      - {id: cpu_omp_simd}
      - {id: gpu_global_atomic, params: {block_size: 128}}
      - {id: gpu_warp_atomic, params: {block_size: 256}}
      - {id: gpu_two_pass, params: {block_size: 128}}
      - {id: gpu_cub}
    hardware:
      cpu_core_class: all
      cpu_thread_policy: all_threads
      gpu_sets: [each]
      gpu_control_mode: dedicated
      memory_policy: interleave
