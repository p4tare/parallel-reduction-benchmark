global:
  output_dir: "./results"
  enable_rapl: true
  enable_nvml: true
  enable_perf: false
  polling_interval_ms: 10
  cooling_threshold_gpu_c: 100.0
  cooling_threshold_cpu_c: 100.0
  orchestrator_core_isolation: true

experiments:
  - id: "EXP_013_WEIGHTED_PROFILOMETRIC_V1"
    algorithm_path: "algorithms/macro_static/exp_013_weighted_profilometric_v1"
    compiler_flags: "auto"
    repetitions: 100
    warmup_runs: 3
    data:
      sizes: [1000000000]
      types: ["int32", "float32_3"] 
      generation_mode: ["ones", "0+-1_binary"]
    hardware:
      gpu_allocation: ["all"]
      cpu_allocation_strategy: ["all", "p_cores_only", "physical_cores_only"]
      use_dedicated_gpu_threads: [true]
      cuda_block_sizes: [32]

  - id: "EXP_013_WEIGHTED_PROFILOMETRIC_V2"
    algorithm_path: "algorithms/macro_static/exp_013_weighted_profilometric_v2"
    compiler_flags: "auto"
    repetitions: 100
    warmup_runs: 3
    data:
      sizes: [1000000000]
      types: ["int32", "float32_3"] 
      generation_mode: ["ones", "0+-1_binary"]
    hardware:
      gpu_allocation: ["all"]
      cpu_allocation_strategy: ["all", "p_cores_only", "physical_cores_only"]
      use_dedicated_gpu_threads: [true]
      cuda_block_sizes: [32]

  - id: "EXP_013_WEIGHTED_PROFILOMETRIC_V3"
    algorithm_path: "algorithms/macro_static/exp_013_weighted_profilometric_v3"
    compiler_flags: "auto"
    repetitions: 100
    warmup_runs: 3
    data:
      sizes: [1000000000]
      types: ["int32", "float32_3"] 
      generation_mode: ["ones", "0+-1_binary"]
    hardware:
      gpu_allocation: ["all"]
      cpu_allocation_strategy: ["all", "p_cores_only", "physical_cores_only"]
      use_dedicated_gpu_threads: [true]
      cuda_block_sizes: [32]