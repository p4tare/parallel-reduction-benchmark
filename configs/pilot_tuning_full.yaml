# COMPREHENSIVE EXPLORATORY GRID — NOT FINAL THESIS DATA.
#
# This file intentionally explores a broad finite candidate set. Some tunables accept
# infinitely many legal numeric values, so "all possible values" cannot be enumerated
# literally. See CONFIGURATION_REFERENCE.md for the exact domains.
#
# Use only when you intentionally want a large sensitivity/tuning campaign.
output_dir: results
build:
  build_dir: build
  build_type: Release
  native_cpu_tuning: true
  enable_cuda: "on"
measurement:
  warmup_runs: 5
  timing_repetitions: 10
  energy_batch_repetitions: auto
  energy_target_batch_seconds: 1.0
  energy_min_repetitions: 10
  energy_max_repetitions: 1000
  blocks: 2
  randomization_seed: 73003
  max_dataset_ram_fraction: 0.65
  thermal_safety_gpu_c: 90
  thermal_safety_cpu_c: 95
  worker_event_timeout_s: 1800
  thermal_wait_timeout_s: 300
energy:
  # v2.3 skips the ENERGY phase entirely when both are false.
  enable_cpu: false
  enable_gpu: false
experiments:
  - id: comprehensive_tuning_each_gpu
    datasets:
      - {size: 1048576, dtype: float32, distribution: symmetric_uniform, seed: 20260813, low: -1.0, high: 1.0, quantization: {mode: binary_fraction, bits: 8}}
      - {size: 10000000, dtype: float32, distribution: symmetric_uniform, seed: 20260813, low: -1.0, high: 1.0, quantization: {mode: binary_fraction, bits: 8}}
      - {size: 100000000, dtype: float32, distribution: symmetric_uniform, seed: 20260813, low: -1.0, high: 1.0, quantization: {mode: binary_fraction, bits: 8}}
    algorithms:
      # Every block size accepted by the strict schema.
      - {id: gpu_global_atomic, params: {block_size: [32, 64, 128, 256, 512, 1024]}}
      - {id: gpu_shared_naive, params: {block_size: [32, 64, 128, 256, 512, 1024]}}
      - {id: gpu_warp_atomic, params: {block_size: [32, 64, 128, 256, 512, 1024]}}
      - {id: gpu_two_pass, params: {block_size: [32, 64, 128, 256, 512, 1024]}}

      # All combinations below satisfy pipeline_chunks >= pipeline_streams.
      - {id: hybrid_static_profiled_async, params: {pipeline_streams: 1, pipeline_chunks: [1, 2, 4, 8, 16, 32, 64]}}
      - {id: hybrid_static_profiled_async, params: {pipeline_streams: 2, pipeline_chunks: [2, 4, 8, 16, 32, 64]}}
      - {id: hybrid_static_profiled_async, params: {pipeline_streams: 4, pipeline_chunks: [4, 8, 16, 32, 64]}}
      - {id: hybrid_static_profiled_async, params: {pipeline_streams: 8, pipeline_chunks: [8, 16, 32, 64]}}

      # Broad powers-of-two chunk grid: 16 Ki to 32 Mi elements.
      - id: hybrid_dynamic_fixed
        params:
          chunk_size: [16384, 32768, 65536, 131072, 262144, 524288, 1048576, 2097152, 4194304, 8388608, 16777216, 33554432]

      - id: hybrid_dynamic_guided
        params:
          min_chunk_size: [16384, 65536, 262144, 1048576]
          guided_factor: [1.25, 1.5, 2.0, 3.0, 4.0, 6.0, 8.0]

      # Broad adaptive grid. Every min is <= every max, so the Cartesian product is valid.
      - id: hybrid_dynamic_adaptive
        params:
          min_chunk_size: [16384, 65536, 262144]
          max_chunk_size: [4194304, 16777216, 67108864]
          target_chunk_ms: [0.5, 1.0, 2.0, 5.0, 10.0, 20.0]
          ema_alpha: [0.1, 0.25, 0.5, 0.75, 1.0]
    hardware:
      cpu_core_class: all
      cpu_thread_policy: all_threads
      gpu_sets: [each]
      gpu_control_mode: dedicated
      memory_policy: interleave
