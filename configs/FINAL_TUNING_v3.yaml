# FINAL v3 parameter-selection campaign. NOT confirmatory thesis data.
# Run once per machine after FINAL_VALIDATION_v3.yaml passes.
# Select one robust parameter set per algorithm from this independent grid, then freeze it
# in FINAL_RESEARCH_ALGORITHMS_v3.yaml / FINAL_RESEARCH_SCALING_v3.yaml before collecting data.
output_dir: results
dataset_cache_dir: .prbench/datasets

build:
  build_dir: build
  build_type: Release
  native_cpu_tuning: true
  enable_cuda: "on"
  jobs: null
  cxx_compiler: null
  cuda_host_compiler: null

measurement:
  warmup_runs: 4
  scheduler_calibration_repetitions: 5
  timing_repetitions: auto
  timing_probe_repetitions: 7
  timing_target_batch_seconds: 0.20
  timing_min_repetitions: 15
  timing_max_repetitions: 1000
  cache_rotation_target_bytes: 268435456
  cache_rotation_max_replicas: 1024
  energy_batch_repetitions: 10
  energy_target_batch_seconds: 1.0
  energy_min_repetitions: 1
  energy_max_repetitions: 100
  blocks: 3
  randomization_seed: 20260830
  max_dataset_ram_fraction: 0.60
  gpu_memory_safety_fraction: 0.80
  thermal_safety_gpu_c: 85
  thermal_safety_cpu_c: 95
  thermal_wait_timeout_s: 300
  worker_event_timeout_s: 1800
  strict_preflight: true
  max_preflight_cpu_load_percent: 5.0
  allow_gpu_graphics_processes: false

energy:
  enable_cpu: false
  enable_gpu: false
  gpu_power_fallback_poll_ms: 50

telemetry:
  enabled: true
  capture_cpu_frequency: true
  capture_cpu_temperature: true
  capture_gpu_state: true
  capture_pre_post_timing: true
  capture_pre_post_energy: false

system_baselines:
  capture_memory_inventory: true
  stream_executable: null
  stream_args: []
  stream_timeout_s: 120

experiments:
  # Micro-kernel tuning. CUB sync itself is parameter-free; gpu_cub_async tunes the
  # transfer pipeline independently from the hybrid scheduler.
  - id: tune_single_gpu
    operations: [sum, min, max]
    datasets:
      - {size: 10000000, dtype: float32, distribution: uniform, seed: 31001, low: -1.0, high: 1.0,
         quantization: {mode: binary_fraction, bits: 8}}
      - {size: 100000000, dtype: float32, distribution: uniform, seed: 31002, low: -1.0, high: 1.0,
         quantization: {mode: binary_fraction, bits: 8}}
      - {size: 10000000, dtype: int64, distribution: integers, seed: 31101, low: -1000000, high: 1000000}
      - {size: 100000000, dtype: int64, distribution: integers, seed: 31102, low: -1000000, high: 1000000}
    algorithms:
      - {id: gpu_global_atomic, params: {block_size: [128, 256, 512]}}
      - {id: gpu_shared_naive, params: {block_size: [128, 256, 512]}}
      - {id: gpu_warp_atomic, params: {block_size: [128, 256, 512]}}
      - {id: gpu_two_pass, params: {block_size: [128, 256, 512]}}
      - {id: gpu_cub_async, params: {pipeline_streams: [2, 4], pipeline_chunks: [8, 16, 32]}}
    hardware:
      cpu_core_class: all
      cpu_thread_policy: one_thread_per_core
      gpu_sets: [each]
      gpu_control_mode: dedicated
      memory_policy: interleave

  # Scheduler tuning uses both one-GPU and complete multi-GPU configurations so one
  # parameter set is selected robustly rather than overfitted to a single topology.
  - id: tune_hybrid
    operations: [sum, min, max]
    datasets:
      - {size: 10000000, dtype: float32, distribution: uniform, seed: 31201, low: -1.0, high: 1.0,
         quantization: {mode: binary_fraction, bits: 8}}
      - {size: 100000000, dtype: float32, distribution: uniform, seed: 31202, low: -1.0, high: 1.0,
         quantization: {mode: binary_fraction, bits: 8}}
      - {size: 10000000, dtype: int64, distribution: integers, seed: 31301, low: -1000000, high: 1000000}
      - {size: 100000000, dtype: int64, distribution: integers, seed: 31302, low: -1000000, high: 1000000}
    algorithms:
      - {id: hybrid_static_profiled_async,
         params: {pipeline_streams: [2, 4], pipeline_chunks: [8, 16, 32]}}
      - {id: hybrid_dynamic_fixed,
         params: {chunk_size: [262144, 1048576, 4194304, 16777216]}}
      - {id: hybrid_dynamic_guided,
         params: {min_chunk_size: [65536, 262144, 1048576], guided_factor: [2.0, 4.0, 8.0]}}
      - {id: hybrid_dynamic_adaptive,
         params: {min_chunk_size: [65536, 262144],
                  max_chunk_size: [4194304, 16777216],
                  target_chunk_ms: [1.0, 2.0, 5.0],
                  ema_alpha: [0.25, 0.5]}}
    hardware:
      cpu_core_class: all
      cpu_thread_policy: one_thread_per_core
      gpu_sets: [each, all]
      gpu_control_mode: dedicated
      memory_policy: interleave
