# Intel/other heterogeneous-core validation. This intentionally fails fast if
# performance/efficiency classes cannot be classified by the native topology probe.
output_dir: results
build:
  build_dir: build
  build_type: Release
  native_cpu_tuning: true
  enable_cuda: auto
measurement:
  warmup_runs: 2
  timing_repetitions: 3
  energy_batch_repetitions: 3
  energy_target_batch_seconds: 1.0
  energy_min_repetitions: 3
  energy_max_repetitions: 100
  blocks: 1
  randomization_seed: 73001
  max_dataset_ram_fraction: 0.2
  worker_event_timeout_s: 1800
  thermal_wait_timeout_s: 60
energy:
  enable_cpu: false
  enable_gpu: false
experiments:
  - id: p_cores
    datasets:
      - {size: 1048576, dtype: float32, distribution: symmetric_uniform, seed: 17, low: -1.0, high: 1.0, quantization: {mode: binary_fraction, bits: 8}}
    algorithms: [{id: cpu_seq}, {id: cpu_omp}, {id: cpu_omp_simd}, {id: hybrid_static_equal}]
    hardware:
      cpu_core_class: performance
      cpu_thread_policy: all_threads
      gpu_sets: [each]
      gpu_control_mode: dedicated
      memory_policy: interleave

  - id: e_cores
    datasets:
      - {size: 1048576, dtype: float32, distribution: symmetric_uniform, seed: 17, low: -1.0, high: 1.0, quantization: {mode: binary_fraction, bits: 8}}
    algorithms: [{id: cpu_seq}, {id: cpu_omp}, {id: cpu_omp_simd}, {id: hybrid_static_equal}]
    hardware:
      cpu_core_class: efficiency
      cpu_thread_policy: all_threads
      gpu_sets: [each]
      gpu_control_mode: dedicated
      memory_policy: interleave

  - id: all_cores
    datasets:
      - {size: 1048576, dtype: float32, distribution: symmetric_uniform, seed: 17, low: -1.0, high: 1.0, quantization: {mode: binary_fraction, bits: 8}}
    algorithms: [{id: cpu_seq}, {id: cpu_omp}, {id: cpu_omp_simd}, {id: hybrid_static_equal}]
    hardware:
      cpu_core_class: all
      cpu_thread_policy: all_threads
      gpu_sets: [each]
      gpu_control_mode: dedicated
      memory_policy: interleave
