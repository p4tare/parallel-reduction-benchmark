# Validates automatic TIMING batch sizing without CUDA or energy.
output_dir: results
build:
  build_dir: build
  build_type: Release
  native_cpu_tuning: true
  enable_cuda: "off"
measurement:
  warmup_runs: 2
  scheduler_calibration_repetitions: 3
  timing_repetitions: auto
  timing_probe_repetitions: 5
  timing_target_batch_seconds: 0.02
  timing_min_repetitions: 10
  timing_max_repetitions: 2000
  energy_batch_repetitions: auto
  blocks: 1
  randomization_seed: 2606
  max_dataset_ram_fraction: 0.2
energy:
  enable_cpu: false
  enable_gpu: false
telemetry:
  enabled: true
  capture_cpu_frequency: true
  capture_cpu_temperature: true
  capture_gpu_state: false
  capture_pre_post_timing: true
  capture_pre_post_energy: false
experiments:
  - id: auto_timing_cpu_smoke
    operations: [sum]
    datasets:
      - {size: 100000, dtype: float32, distribution: symmetric_uniform, seed: 7, low: -1.0, high: 1.0, quantization: {mode: binary_fraction, bits: 8}}
    algorithms:
      - {id: cpu_seq}
      - {id: cpu_omp}
      - {id: cpu_omp_simd}
    hardware:
      cpu_core_class: all
      cpu_thread_policy: one_thread_per_core
      gpu_sets: []
      gpu_control_mode: dedicated
      memory_policy: default
