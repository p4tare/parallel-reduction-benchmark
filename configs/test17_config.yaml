global:
  output_dir: "./results"
  enable_rapl: true
  enable_nvml: true
  enable_perf: false
  polling_interval_ms: 10
  cooling_threshold_gpu_c: 100.0
  cooling_threshold_cpu_c: 100.0
  orchestrator_core_isolation: true

experiments:
  - id: "EXP_012_STATIC_EQUAL"
    algorithm_path: "algorithms/macro_static/exp_012_static_equal"
    compiler_flags: "auto"
    repetitions: 100
    warmup_runs: 5
    data:
      sizes: [100000, 1000000, 100000000]
      types: ["int32", "int64", "float32_2", "float32_4"] 
      generation_mode: ["ones", "0+-2", "0+-2_binary"]
    hardware:
      gpu_allocation: ["all"]
      cpu_allocation_strategy: ["all", "p_cores_only", "physical_cores_only"]
      use_dedicated_gpu_threads: [true, false]
      cuda_block_sizes: [32, 256, 1024]

  - id: "EXP_013_WEIGHTED_PROFILOMETRIC"
    algorithm_path: "algorithms/macro_static/exp_013_weighted_profilometric"
    compiler_flags: "auto"
    repetitions: 100
