global:
  output_dir: "./results"
  enable_rapl: true
  enable_nvml: true
  enable_perf: false
  polling_interval_ms: 10
  cooling_threshold_gpu_c: 80.0
  cooling_threshold_cpu_c: 80.0
  orchestrator_core_isolation: true

experiments:
  - id: "EXP_002_SHARED_MEM_SUM"
    algorithm_path: "algorithms/gpu_single/exp_002_shared_mem_sum"
    compiler_flags: "auto"
    repetitions: 2000
    warmup_runs: 5
    data:
      sizes: [100, 100000] 
      types: ["int32", "float32_2"] 
      generation_mode: ["0+-5", "0+-5_binary"]
    hardware:
      gpu_allocation: "0" 
      cpu_allocation_strategy: ["all"] 
      use_dedicated_gpu_threads: [false]
      cuda_block_sizes: [512]

  - id: "EXP_012_STATIC_EQUAL"
    algorithm_path: "algorithms/macro_static/exp_012_static_equal"
    compiler_flags: "auto"
    repetitions: 2000
    warmup_runs: 5
    data:
      sizes: [1000, 1000000]
      types: ["int32", "float32_2", "float32_4"] 
      generation_mode: ["0+-2", "0+-5", "0+-5_binary"]
    hardware:
      gpu_allocation: ["all"] 
      cpu_allocation_strategy: ["all", "p_cores_only", "e_cores_only", "physical_cores_only"]
      use_dedicated_gpu_threads: [false, true] 
      cuda_block_sizes: [256, 512, 1024]