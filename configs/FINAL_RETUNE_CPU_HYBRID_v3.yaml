# Narrow confirmatory retuning after explicit OpenMP CPU-place binding.
# NOT thesis data. Search space is restricted using the complete 6084-task tuning run.
output_dir: results
dataset_cache_dir: .prbench/datasets

build:
  build_dir: build
  build_type: Release
  native_cpu_tuning: true
  enable_cuda: "on"
  jobs: null
  cxx_compiler: null
  cuda_host_compiler: null

measurement:
  warmup_runs: 4
  scheduler_calibration_repetitions: 7
  timing_repetitions: auto
  timing_probe_repetitions: 7
  timing_target_batch_seconds: 0.20
  timing_min_repetitions: 15
  timing_max_repetitions: 1000
  cache_rotation_target_bytes: 268435456
  cache_rotation_max_replicas: 1024
  energy_batch_repetitions: 1
  energy_target_batch_seconds: 1.0
  energy_min_repetitions: 1
  energy_max_repetitions: 1
  blocks: 3
  randomization_seed: 20260831
  max_dataset_ram_fraction: 0.60
  gpu_memory_safety_fraction: 0.80
  thermal_safety_gpu_c: 85
  thermal_safety_cpu_c: 95
  thermal_wait_timeout_s: 300
  worker_event_timeout_s: 1800
  strict_preflight: true
  max_preflight_cpu_load_percent: 5.0
  allow_gpu_graphics_processes: false

energy:
  enable_cpu: false
  enable_gpu: false
  gpu_power_fallback_poll_ms: 50

telemetry:
  enabled: true
  capture_cpu_frequency: true
  capture_cpu_temperature: true
  capture_gpu_state: true
  capture_pre_post_timing: true
  capture_pre_post_energy: false

system_baselines:
  capture_memory_inventory: true
  stream_executable: null
  stream_args: []
  stream_timeout_s: 120

experiments:
  - id: retune_cpu_one_thread_per_core
    operations: [sum, min, max]
    datasets: &retune_cpu_datasets
      - {size: 10000000, dtype: float32, distribution: uniform, seed: 33901, low: -1.0, high: 1.0,
         quantization: {mode: binary_fraction, bits: 8}}
      - {size: 100000000, dtype: float32, distribution: uniform, seed: 33902, low: -1.0, high: 1.0,
         quantization: {mode: binary_fraction, bits: 8}}
      - {size: 10000000, dtype: int64, distribution: integers, seed: 33903, low: -1000000, high: 1000000}
      - {size: 100000000, dtype: int64, distribution: integers, seed: 33904, low: -1000000, high: 1000000}
    algorithms:
      - {id: cpu_omp}
      - {id: cpu_omp_simd}
    hardware:
      cpu_core_class: all
      cpu_thread_policy: one_thread_per_core
      gpu_sets: [0]
      gpu_control_mode: dedicated
      memory_policy: interleave

  - id: retune_cpu_all_threads
    operations: [sum, min, max]
    datasets: *retune_cpu_datasets
    algorithms:
      - {id: cpu_omp}
      - {id: cpu_omp_simd}
    hardware:
      cpu_core_class: all
      cpu_thread_policy: all_threads
      gpu_sets: [0]
      gpu_control_mode: dedicated
      memory_policy: interleave

  - id: retune_hybrid
    operations: [sum, min, max]
    datasets:
      - {size: 10000000, dtype: float32, distribution: uniform, seed: 34001, low: -1.0, high: 1.0,
         quantization: {mode: binary_fraction, bits: 8}}
      - {size: 100000000, dtype: float32, distribution: uniform, seed: 34002, low: -1.0, high: 1.0,
         quantization: {mode: binary_fraction, bits: 8}}
      - {size: 10000000, dtype: int64, distribution: integers, seed: 34101, low: -1000000, high: 1000000}
      - {size: 100000000, dtype: int64, distribution: integers, seed: 34102, low: -1000000, high: 1000000}
    algorithms:
      - {id: hybrid_static_profiled_async,
         params: {pipeline_streams: [2, 4], pipeline_chunk_elements: 1048576}}
      - {id: hybrid_dynamic_fixed,
         params: {chunk_size: [262144, 1048576]}}
      - {id: hybrid_dynamic_guided,
         params: {min_chunk_size: [65536, 262144], guided_factor: 8.0}}
      - {id: hybrid_dynamic_adaptive,
         params: {min_chunk_size: [65536, 262144],
                  max_chunk_size: 16777216,
                  target_chunk_ms: 1.0,
                  ema_alpha: [0.25, 0.5]}}
    hardware:
      cpu_core_class: all
      cpu_thread_policy: one_thread_per_core
      gpu_sets: [each, all]
      gpu_control_mode: dedicated
      memory_policy: interleave
