global:
  output_dir: "./results"
  enable_rapl: true
  enable_nvml: true
  enable_perf: false
  polling_interval_ms: 10
  cooling_threshold_gpu_c: 100.0
  cooling_threshold_cpu_c: 100.0
  orchestrator_core_isolation: true

experiments:
  - id: "EXP_002_NAIVE_SHARED_MEMORY"
    algorithm_path: "algorithms/gpu_single/exp_002_shared_mem_sum"
    compiler_flags: "auto"
    repetitions: 10
    warmup_runs: 3
    data:
      sizes: [100000000, 250000000]
      types: ["float32", "int32"]
      generation_mode: ["random_uniform"]
    hardware:
      gpu_allocation: ["[0]"] 
      cpu_allocation_strategy: ["all"]
      use_dedicated_gpu_threads: [false]
      cuda_block_sizes: [256, 512, 1024]