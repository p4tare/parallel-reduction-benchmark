# Targeted CUDA smoke for the diagnostic device-resident CUB path.
# Run this after any change to DeviceResident before the 888-task full validation.
output_dir: results
dataset_cache_dir: .prbench/datasets

build:
  build_dir: build
  build_type: Release
  native_cpu_tuning: true
  enable_cuda: "on"
  jobs: null
  cxx_compiler: null
  cuda_host_compiler: null

measurement:
  warmup_runs: 2
  scheduler_calibration_repetitions: 2
  timing_repetitions: 3
  timing_probe_repetitions: 3
  timing_target_batch_seconds: 0.05
  timing_min_repetitions: 3
  timing_max_repetitions: 3
  cache_rotation_target_bytes: 0
  cache_rotation_max_replicas: 1
  energy_batch_repetitions: 1
  energy_target_batch_seconds: 0.5
  energy_min_repetitions: 1
  energy_max_repetitions: 1
  blocks: 1
  randomization_seed: 20260829
  max_dataset_ram_fraction: 0.25
  gpu_memory_safety_fraction: 0.80
  thermal_safety_gpu_c: 85
  thermal_safety_cpu_c: 95
  thermal_wait_timeout_s: 120
  worker_event_timeout_s: 300
  strict_preflight: false
  max_preflight_cpu_load_percent: 20.0
  allow_gpu_graphics_processes: true

energy:
  enable_cpu: false
  enable_gpu: false
  gpu_power_fallback_poll_ms: 50

telemetry:
  enabled: true
  capture_cpu_frequency: true
  capture_cpu_temperature: true
  capture_gpu_state: true
  capture_pre_post_timing: true
  capture_pre_post_energy: false

system_baselines:
  capture_memory_inventory: true
  stream_executable: null
  stream_args: []
  stream_timeout_s: 120

experiments:
  - id: smoke_device_resident
    operations: [sum, min, max]
    datasets:
      - {size: 33, dtype: int32, distribution: integers, seed: 50101, low: -3, high: 3}
      - {size: 100003, dtype: int64, distribution: integers, seed: 50102, low: -1000, high: 1000}
      - {size: 37, dtype: float32, distribution: symmetric_uniform, seed: 50103,
         low: -1.0, high: 1.0, quantization: {mode: binary_fraction, bits: 8}}
      - {size: 100003, dtype: float64, distribution: symmetric_uniform, seed: 50104,
         low: -1.0, high: 1.0, quantization: {mode: binary_fraction, bits: 16}}
    algorithms:
      - {id: gpu_cub}
      - {id: gpu_cub_device_resident}
    hardware:
      cpu_core_class: all
      cpu_thread_policy: one_thread_per_core
      gpu_sets: [each]
      gpu_control_mode: dedicated
      memory_policy: default
