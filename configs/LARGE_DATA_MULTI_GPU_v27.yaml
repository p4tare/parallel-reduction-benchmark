# Large-data extension for a machine expected to have high-memory GPUs.
# prbench v2.7.0
#
# The 8/16/32 GB conditions compare CPU, every single GPU and multi-GPU CUB.
# The 64 GB condition intentionally goes beyond a nominal 48 GB single GPU and is
# therefore tested only on CPU and multi-GPU CUB.  Preflight MUST be run first: it
# rejects insufficient host RAM or exact GPU allocations before dataset generation.
#
# This is expensive: each task still loads the full host dataset into the worker.
# Use 3 blocks here as a large-scale extension; the main confirmatory study uses 5.

output_dir: results
dataset_cache_dir: .prbench/datasets

build:
  build_dir: build
  build_type: Release
  native_cpu_tuning: true
  enable_cuda: "on"
  jobs: null
  cxx_compiler: null
  cuda_host_compiler: null

measurement:
  warmup_runs: 3
  scheduler_calibration_repetitions: 3
  timing_repetitions: auto
  timing_probe_repetitions: 5
  timing_target_batch_seconds: 2.0
  timing_min_repetitions: 10
  timing_max_repetitions: 100
  energy_batch_repetitions: auto
  energy_target_batch_seconds: 3.0
  energy_min_repetitions: 5
  energy_max_repetitions: 1000
  blocks: 3
  randomization_seed: 20260828
  max_dataset_ram_fraction: 0.55
  gpu_memory_safety_fraction: 0.80
  thermal_safety_gpu_c: 85
  thermal_safety_cpu_c: 95
  thermal_wait_timeout_s: 300
  worker_event_timeout_s: 3600

telemetry:
  enabled: true
  capture_cpu_frequency: true
  capture_cpu_temperature: true
  capture_gpu_state: true
  capture_pre_post_timing: true
  capture_pre_post_energy: true

system_baselines:
  capture_memory_inventory: true
  stream_executable: null
  stream_args: []
  stream_timeout_s: 180

energy:
  enable_cpu: true
  enable_gpu: true
  gpu_power_fallback_poll_ms: 50

experiments:
  # Fits comfortably in a nominal 48 GB GPU, leaving VRAM headroom.
  - id: large_single_device_int64
    operations: [sum, min, max]
    datasets:
      - {size: 1000000000, dtype: int64, distribution: integers, seed: 28001,
         low: -1000000, high: 1000000, quantization: {mode: none}}  # 8 GB
      - {size: 2000000000, dtype: int64, distribution: integers, seed: 28001,
         low: -1000000, high: 1000000, quantization: {mode: none}}  # 16 GB
      - {size: 4000000000, dtype: int64, distribution: integers, seed: 28001,
         low: -1000000, high: 1000000, quantization: {mode: none}}  # 32 GB
    algorithms:
      - {id: cpu_omp_simd}
      - {id: gpu_cub}
    hardware:
      cpu_core_class: all
      cpu_thread_policy: one_thread_per_core
      gpu_sets: [each]
      gpu_control_mode: dedicated
      memory_policy: interleave

  - id: large_multi_gpu_int64
    operations: [sum, min, max]
    datasets:
      - {size: 1000000000, dtype: int64, distribution: integers, seed: 28001,
         low: -1000000, high: 1000000, quantization: {mode: none}}
      - {size: 2000000000, dtype: int64, distribution: integers, seed: 28001,
         low: -1000000, high: 1000000, quantization: {mode: none}}
      - {size: 4000000000, dtype: int64, distribution: integers, seed: 28001,
         low: -1000000, high: 1000000, quantization: {mode: none}}
    algorithms:
      - {id: gpu_multi_cub_equal}
      - {id: gpu_multi_cub_profiled}
    hardware:
      cpu_core_class: all
      cpu_thread_policy: one_thread_per_core
      gpu_sets: [pairs, all]
      gpu_control_mode: dedicated
      memory_policy: interleave

  # 64 GB: intended to exceed one nominal 48 GB GPU.  No gpu_cub single-GPU task is
  # created, so a 2x48 GB machine can test whether partitioning across GPUs is useful.
  - id: beyond_single_gpu_vram_int64
    operations: [sum, min, max]
    datasets:
      - {size: 8000000000, dtype: int64, distribution: integers, seed: 28002,
         low: -1000000, high: 1000000, quantization: {mode: none}}  # 64 GB
    algorithms:
      - {id: cpu_omp_simd}
      - {id: gpu_multi_cub_equal}
    hardware:
      cpu_core_class: all
      cpu_thread_policy: one_thread_per_core
      gpu_sets: [pairs, all]
      gpu_control_mode: dedicated
      memory_policy: interleave
