# APL13 FINAL V4 OUT-OF-CORE EXTENSION
# Supplemental final study for a dataset larger than apl13 physical RAM.
# This is intentionally separate from comprehensive_v4.yaml because out-of-core
# tasks have fundamentally different I/O cost and need a much smaller repetition budget.
#
# IMPORTANT: current file_stream paths are NOT GPUDirect Storage.
# Data path: filesystem -> Linux page cache / std::ifstream -> host staging -> H2D -> VRAM.
# Direct file->VRAM would require a working cuFile/GDS stack, which is unavailable on apl13.
#
# Dataset: 192 GiB float32 (> ~187.3 GiB physical RAM).
# Scope: sum only, three representative implementations, three randomized blocks.

output_dir: results/apl13_final_out_of_core_v4
dataset_cache_dir: .prbench/datasets

build:
  build_dir: build
  build_type: Release
  native_cpu_tuning: true
  enable_cuda: "on"
  jobs: null
  cxx_compiler: /usr/bin/g++-13
  cuda_host_compiler: /usr/bin/g++-13

measurement:
  warmup_runs: 1
  scheduler_calibration_repetitions: 3
  scheduler_calibration_bursts: 1
  timing_repetitions: 3
  timing_probe_repetitions: 3
  timing_target_batch_seconds: 0.50
  timing_min_repetitions: 3
  timing_max_repetitions: 3
  cache_rotation_target_bytes: 0
  cache_rotation_max_replicas: 1
  energy_batch_repetitions: 1
  energy_target_batch_seconds: 3.0
  energy_min_repetitions: 1
  energy_max_repetitions: 1
  blocks: 3
  randomization_seed: 20261001
  max_dataset_ram_fraction: 0.70
  max_dataset_storage_fraction_of_free: 0.90
  gpu_memory_safety_fraction: 0.80
  thermal_safety_gpu_c: 85
  thermal_safety_cpu_c: 95
  thermal_wait_timeout_s: 300
  worker_event_timeout_s: 43200
  strict_preflight: true
  max_preflight_cpu_load_percent: 10.0
  allow_gpu_graphics_processes: false

energy:
  enable_cpu: true
  enable_gpu: true
  gpu_power_fallback_poll_ms: 50

telemetry:
  enabled: true
  capture_cpu_frequency: true
  capture_cpu_temperature: true
  capture_gpu_state: true
  capture_pre_post_timing: true
  capture_pre_post_energy: true

system_baselines:
  capture_memory_inventory: true
  stream_executable: null
  stream_args: []
  stream_timeout_s: 180

experiments:
  - id: final_ooc_cpu_192gib
    operations: [sum]
    datasets: &ooc_192gib
      - &f32_192gib {size: 51539607552, dtype: float32, distribution: uniform, seed: 63101, low: -1.0, high: 1.0, quantization: {mode: binary_fraction, bits: 8}}
    algorithms:
      - {id: cpu_omp_simd_file_stream, params: {chunk_size: 67108864}}
    hardware:
      cpu_core_class: all
      cpu_thread_policy: one_thread_per_core
      gpu_sets: []
      gpu_control_mode: dedicated
      memory_policy: default
      gpu_staging_numa: auto

  - id: final_ooc_single_gpu_async_192gib
    operations: [sum]
    datasets: *ooc_192gib
    algorithms:
      - {id: gpu_cub_file_stream_async, params: {pipeline_streams: 4, pipeline_chunk_elements: 67108864, reuse_count: 1}}
    hardware:
      cpu_core_class: all
      cpu_thread_policy: one_thread_per_core
      gpu_sets: [0]
      gpu_control_mode: dedicated
      memory_policy: default
      gpu_staging_numa: auto

  - id: final_ooc_two_gpu_async_192gib
    operations: [sum]
    datasets: *ooc_192gib
    algorithms:
      - {id: gpu_multi_cub_file_stream_async, params: {pipeline_streams: 4, pipeline_chunk_elements: 67108864, reuse_count: 1}}
    hardware:
      cpu_core_class: all
      cpu_thread_policy: one_thread_per_core
      gpu_sets: [[0, 1]]
      gpu_control_mode: dedicated
      memory_policy: default
      gpu_staging_numa: auto
