# APL13 V4 24H REUSE + TRANSFER-CHUNK CAMPAIGN
# The complete previous FINAL V4 COMPREHENSIVE campaign is retained as the baseline.
# This follow-up prioritizes reuse-count and transfer-chunk sensitivity while avoiding
# the explosive N=1e10 / 192 GiB Cartesian products from the exploratory draft.
#
# Single-GPU experiments use GPU 0. Multi-GPU experiments use GPUs [0,1].
# HMM and GDS remain capability probes because apl13 cannot execute them.
# Canonical practical reuse sweep: K=[1, 2, 3, 4, 5, 10, 15, 20, 21, 22, 25, 30, 50, 100].
# Chunk sensitivity is focused on representative float32 SUM datasets:
#   small/medium chunks at N=1e8: 1, 4, 16, 64, 256 MiB
#   large chunks at 4 GiB:       256, 512 MiB, 1, 2, 4 GiB
# File-stream retains the complete previous coverage and receives chunk sensitivity at K=1;
# its existing 64 MiB reuse groups receive the full K sweep.

output_dir: results/apl13_reuse_chunks_24h_v4
dataset_cache_dir: .prbench/datasets

sweeps:
  reuse_count: [1, 2, 3, 4, 5, 10, 15, 20, 21, 22, 25, 30, 50, 100]

build:
  build_dir: build
  build_type: Release
  native_cpu_tuning: true
  enable_cuda: "on"
  jobs: null
  cxx_compiler: /usr/bin/g++-13
  cuda_host_compiler: /usr/bin/g++-13

measurement:
  warmup_runs: 2
  scheduler_calibration_repetitions: 3
  scheduler_calibration_bursts: 1
  timing_repetitions: auto
  timing_probe_repetitions: 3
  timing_target_batch_seconds: 0.50
  timing_min_repetitions: 5
  timing_max_repetitions: 100
  cache_rotation_target_bytes: 134217728
  cache_rotation_max_replicas: 256
  energy_batch_repetitions: auto
  energy_target_batch_seconds: 3.0
  energy_min_repetitions: 1
  energy_max_repetitions: 200
  blocks: 3
  randomization_seed: 20261006
  max_dataset_ram_fraction: 0.70
  max_dataset_storage_fraction_of_free: 0.90
  gpu_memory_safety_fraction: 0.80
  thermal_safety_gpu_c: 85
  thermal_safety_cpu_c: 95
  thermal_wait_timeout_s: 300
  worker_event_timeout_s: 7200
  strict_preflight: true
  max_preflight_cpu_load_percent: 10.0
  allow_gpu_graphics_processes: false

energy:
  enable_cpu: true
  enable_gpu: true
  gpu_power_fallback_poll_ms: 50

telemetry:
  enabled: true
  capture_cpu_frequency: true
  capture_cpu_temperature: true
  capture_gpu_state: true
  capture_pre_post_timing: true
  capture_pre_post_energy: true

system_baselines:
  capture_memory_inventory: true
  stream_executable: null
  stream_args: []
  stream_timeout_s: 180

experiments:
  # ---------------------------------------------------------------------------
  # A. CORE MATRIX: every legacy/new host-resident algorithm, all operations,
  #    all four dtypes, N=1e5/1e6/1e7/1e8.
  # ---------------------------------------------------------------------------
  - id: final_v4_cpu_seq_simd_core
    operations: [sum, min, max]
    datasets: &core_datasets
      - &i32_1e5 {size: 100000, dtype: int32, distribution: integers, seed: 60101, low: -1, high: 1}
      - &i32_1e6 {size: 1000000, dtype: int32, distribution: integers, seed: 60101, low: -1, high: 1}
      - &i32_1e7 {size: 10000000, dtype: int32, distribution: integers, seed: 60101, low: -1, high: 1}
      - &i32_1e8 {size: 100000000, dtype: int32, distribution: integers, seed: 60101, low: -1, high: 1}

      - &i64_1e5 {size: 100000, dtype: int64, distribution: integers, seed: 60201, low: -1000000, high: 1000000}
      - &i64_1e6 {size: 1000000, dtype: int64, distribution: integers, seed: 60201, low: -1000000, high: 1000000}
      - &i64_1e7 {size: 10000000, dtype: int64, distribution: integers, seed: 60201, low: -1000000, high: 1000000}
      - &i64_1e8 {size: 100000000, dtype: int64, distribution: integers, seed: 60201, low: -1000000, high: 1000000}

      - &f32_1e5 {size: 100000, dtype: float32, distribution: uniform, seed: 60301, low: -1.0, high: 1.0, quantization: {mode: binary_fraction, bits: 8}}
      - &f32_1e6 {size: 1000000, dtype: float32, distribution: uniform, seed: 60301, low: -1.0, high: 1.0, quantization: {mode: binary_fraction, bits: 8}}
      - &f32_1e7 {size: 10000000, dtype: float32, distribution: uniform, seed: 60301, low: -1.0, high: 1.0, quantization: {mode: binary_fraction, bits: 8}}
      - &f32_1e8 {size: 100000000, dtype: float32, distribution: uniform, seed: 60301, low: -1.0, high: 1.0, quantization: {mode: binary_fraction, bits: 8}}

      - &f64_1e5 {size: 100000, dtype: float64, distribution: uniform, seed: 60401, low: -1.0, high: 1.0, quantization: {mode: binary_fraction, bits: 16}}
      - &f64_1e6 {size: 1000000, dtype: float64, distribution: uniform, seed: 60401, low: -1.0, high: 1.0, quantization: {mode: binary_fraction, bits: 16}}
      - &f64_1e7 {size: 10000000, dtype: float64, distribution: uniform, seed: 60401, low: -1.0, high: 1.0, quantization: {mode: binary_fraction, bits: 16}}
      - &f64_1e8 {size: 100000000, dtype: float64, distribution: uniform, seed: 60401, low: -1.0, high: 1.0, quantization: {mode: binary_fraction, bits: 16}}
    algorithms:
      - {id: cpu_seq}
      - {id: cpu_omp_simd}
    hardware:
      cpu_core_class: all
      cpu_thread_policy: one_thread_per_core
      gpu_sets: []
      gpu_control_mode: dedicated
      memory_policy: interleave
      gpu_staging_numa: auto

  - id: final_v4_cpu_omp_core
    operations: [sum, min, max]
    datasets: *core_datasets
    algorithms:
      - {id: cpu_omp}
    hardware:
      cpu_core_class: all
      cpu_thread_policy: all_threads
      gpu_sets: []
      gpu_control_mode: dedicated
      memory_policy: interleave
      gpu_staging_numa: auto

  - id: final_v4_single_gpu_legacy_core
    operations: [sum, min, max]
    datasets: *core_datasets
    algorithms:
      - {id: gpu_global_atomic, params: {block_size: 512}}
      - {id: gpu_shared_naive, params: {block_size: 128}}
      - {id: gpu_warp_atomic, params: {block_size: 512}}
      - {id: gpu_two_pass, params: {block_size: 128}}
      - {id: gpu_cub, params: {reuse_count: 1, use_cuda_graphs: false}}
      - {id: gpu_cub_async, params: {pipeline_streams: 4, pipeline_chunks: 16, pipeline_chunk_elements: 1048576, reuse_count: 1}}
    hardware:
      cpu_core_class: all
      cpu_thread_policy: one_thread_per_core
      gpu_sets: [0]
      gpu_control_mode: dedicated
      memory_policy: default
      gpu_staging_numa: auto

  - id: final_v4_single_gpu_memory_paths_core
    operations: [sum, min, max]
    datasets: *core_datasets
    algorithms:
      - {id: gpu_cub_chunked, params: {chunk_size: 67108864, reuse_count: 1}}
      - {id: gpu_cub_pinned_direct, params: {chunk_size: 67108864, reuse_count: 1}}
      - {id: gpu_cub_zero_copy, params: {reuse_count: 1}}
      - {id: gpu_cub_managed_fault, params: {reuse_count: 1}}
      - {id: gpu_cub_managed_prefetch, params: {reuse_count: 1}}
      - {id: gpu_cub_managed_advised, params: {reuse_count: 1}}
      - {id: gpu_cub_device_resident, params: {reuse_count: 1, use_cuda_graphs: false}}
    hardware:
      cpu_core_class: all
      cpu_thread_policy: one_thread_per_core
      gpu_sets: [0]
      gpu_control_mode: dedicated
      memory_policy: default
      gpu_staging_numa: auto

  - id: final_v4_hybrid_one_gpu_core
    operations: [sum, min, max]
    datasets: *core_datasets
    algorithms:
      - {id: hybrid_static_equal}
      - {id: hybrid_static_equal_async, params: {pipeline_streams: 2, pipeline_chunks: 16, pipeline_chunk_elements: 1048576}}
      - {id: hybrid_static_profiled}
      - {id: hybrid_static_profiled_async, params: {pipeline_streams: 2, pipeline_chunks: 16, pipeline_chunk_elements: 1048576}}
      - {id: hybrid_dynamic_fixed, params: {chunk_size: 1048576}}
      - {id: hybrid_dynamic_guided, params: {min_chunk_size: 262144, guided_factor: 8.0}}
      - {id: hybrid_dynamic_adaptive, params: {min_chunk_size: 262144, max_chunk_size: 16777216, target_chunk_ms: 1.0, ema_alpha: 0.25}}
    hardware:
      cpu_core_class: all
      cpu_thread_policy: one_thread_per_core
      gpu_sets: [0]
      gpu_control_mode: dedicated
      memory_policy: interleave
      gpu_staging_numa: auto

  - id: final_v4_multi_gpu_medium
    operations: [sum, min, max]
    datasets: &medium_datasets [*i32_1e8, *i64_1e8, *f32_1e8, *f64_1e8]
