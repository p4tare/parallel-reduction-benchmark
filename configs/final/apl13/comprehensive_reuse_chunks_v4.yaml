    datasets: &large_datasets
      - &i32_1e9 {size: 1000000000, dtype: int32, distribution: integers, seed: 61101, low: -1, high: 1}
      - &i64_1e9 {size: 1000000000, dtype: int64, distribution: integers, seed: 61201, low: -1000000, high: 1000000}
      - &f32_1e9 {size: 1000000000, dtype: float32, distribution: uniform, seed: 61301, low: -1.0, high: 1.0, quantization: {mode: binary_fraction, bits: 8}}
      - &f64_1e9 {size: 1000000000, dtype: float64, distribution: uniform, seed: 61401, low: -1.0, high: 1.0, quantization: {mode: binary_fraction, bits: 16}}
