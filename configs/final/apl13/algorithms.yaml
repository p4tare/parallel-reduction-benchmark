# Machine freeze: apl13.lab.kask.eti.pg.edu.pl
# Tuning source: run_20260830T123946.509114Z + run_20260830T183620.489587Z
# Runtime implementation validated on 157df7b; main includes only a subsequent test-import fix.
# FINAL v3 confirmatory algorithm comparison: CPU + exactly one selected GPU (GPU 0).
# Thesis result data. Do NOT tune parameters after inspecting these results.
#
# The explicit tunables below are the current frozen candidate profile, inherited from the
# previous independent pilot. After FINAL_TUNING_v3 on a new machine, replace ONLY these
# explicit tunables / cpu_thread_policy if the independent tuning grid selects different
# robust values, commit them, tag the commit, then run this file unchanged.
output_dir: results
dataset_cache_dir: .prbench/datasets

build:
  build_dir: build
  build_type: Release
  native_cpu_tuning: true
  enable_cuda: "on"
  jobs: null
  cxx_compiler: null
  cuda_host_compiler: null

measurement:
  warmup_runs: 5
  scheduler_calibration_repetitions: 7
  scheduler_calibration_bursts: 3
  timing_repetitions: auto
  timing_probe_repetitions: 10
  timing_target_batch_seconds: 0.50
  timing_min_repetitions: 30
  timing_max_repetitions: 5000
  cache_rotation_target_bytes: 268435456
  cache_rotation_max_replicas: 1024
  energy_batch_repetitions: auto
  energy_target_batch_seconds: 3.0
  energy_min_repetitions: 10
  energy_max_repetitions: 1000000
  blocks: 7
  randomization_seed: 20260901
  max_dataset_ram_fraction: 0.60
  gpu_memory_safety_fraction: 0.80
  thermal_safety_gpu_c: 85
  thermal_safety_cpu_c: 95
  thermal_wait_timeout_s: 300
  worker_event_timeout_s: 3600
  strict_preflight: true
  max_preflight_cpu_load_percent: 5.0
  allow_gpu_graphics_processes: false

energy:
  enable_cpu: true
  enable_gpu: true
  gpu_power_fallback_poll_ms: 50

telemetry:
  enabled: true
  capture_cpu_frequency: true
  capture_cpu_temperature: true
  capture_gpu_state: true
  capture_pre_post_timing: true
  capture_pre_post_energy: true

system_baselines:
  capture_memory_inventory: true
  stream_executable: null
  stream_args: []
  stream_timeout_s: 180

experiments:
  # Strong CPU/reference implementations use interleaved host pages when several NUMA
  # nodes participate in the selected CPU pool.
  - id: final_cpu_comparison
    operations: [sum, min, max]
    datasets: &final_core_datasets
      # Same size grid for every dtype. int32 range is deliberately bounded so native
      # int32 accumulation cannot overflow even in the optional 1e9 extension.
      - {size: 100000, dtype: int32, distribution: integers, seed: 40101, low: -1, high: 1}
      - {size: 1000000, dtype: int32, distribution: integers, seed: 40101, low: -1, high: 1}
      - {size: 10000000, dtype: int32, distribution: integers, seed: 40101, low: -1, high: 1}
      - {size: 100000000, dtype: int32, distribution: integers, seed: 40101, low: -1, high: 1}

      - {size: 100000, dtype: int64, distribution: integers, seed: 40201, low: -1000000, high: 1000000}
      - {size: 1000000, dtype: int64, distribution: integers, seed: 40201, low: -1000000, high: 1000000}
      - {size: 10000000, dtype: int64, distribution: integers, seed: 40201, low: -1000000, high: 1000000}
      - {size: 100000000, dtype: int64, distribution: integers, seed: 40201, low: -1000000, high: 1000000}

      - {size: 100000, dtype: float32, distribution: uniform, seed: 40301, low: -1.0, high: 1.0,
         quantization: {mode: binary_fraction, bits: 8}}
      - {size: 1000000, dtype: float32, distribution: uniform, seed: 40301, low: -1.0, high: 1.0,
         quantization: {mode: binary_fraction, bits: 8}}
      - {size: 10000000, dtype: float32, distribution: uniform, seed: 40301, low: -1.0, high: 1.0,
         quantization: {mode: binary_fraction, bits: 8}}
      - {size: 100000000, dtype: float32, distribution: uniform, seed: 40301, low: -1.0, high: 1.0,
         quantization: {mode: binary_fraction, bits: 8}}

      - {size: 100000, dtype: float64, distribution: uniform, seed: 40401, low: -1.0, high: 1.0,
         quantization: {mode: binary_fraction, bits: 16}}
      - {size: 1000000, dtype: float64, distribution: uniform, seed: 40401, low: -1.0, high: 1.0,
         quantization: {mode: binary_fraction, bits: 16}}
      - {size: 10000000, dtype: float64, distribution: uniform, seed: 40401, low: -1.0, high: 1.0,
         quantization: {mode: binary_fraction, bits: 16}}
      - {size: 100000000, dtype: float64, distribution: uniform, seed: 40401, low: -1.0, high: 1.0,
         quantization: {mode: binary_fraction, bits: 16}}


    algorithms:
      - {id: cpu_seq}
      - {id: cpu_omp_simd}
    hardware:
      cpu_core_class: all
      cpu_thread_policy: one_thread_per_core
      gpu_sets: [0]
      gpu_control_mode: dedicated
      memory_policy: interleave

  - id: final_cpu_omp_comparison
    operations: [sum, min, max]
    datasets: *final_core_datasets
    algorithms:
      - {id: cpu_omp}
    hardware:
      cpu_core_class: all
      cpu_thread_policy: all_threads
      gpu_sets: [0]
      gpu_control_mode: dedicated
      memory_policy: interleave

  # Single-GPU paths use default first-touch placement. Because the GPU-only worker control
  # thread is pinned to a topology-local CPU, this places the source allocation near GPU 0
  # on NUMA machines instead of deliberately interleaving it over remote sockets.
  - id: final_single_gpu_comparison
    operations: [sum, min, max]
    datasets: *final_core_datasets
    algorithms:
      - {id: gpu_global_atomic, params: {block_size: 512}}
      - {id: gpu_shared_naive, params: {block_size: 128}}
      - {id: gpu_warp_atomic, params: {block_size: 512}}
      - {id: gpu_two_pass, params: {block_size: 128}}
      - {id: gpu_cub}
      - {id: gpu_cub_async, params: {pipeline_streams: 4, pipeline_chunk_elements: 1048576}}
    hardware:
      cpu_core_class: all
      cpu_thread_policy: one_thread_per_core
      gpu_sets: [0]
      gpu_control_mode: dedicated
      memory_policy: default

  # Hybrid paths share the host dataset between CPU and GPU, therefore interleaving is the
  # controlled default on multi-NUMA machines; topology/placement remains recorded.
  - id: final_hybrid_comparison
    operations: [sum, min, max]
    datasets: *final_core_datasets
    algorithms:
      - {id: hybrid_static_equal}
      - {id: hybrid_static_profiled}
      - {id: hybrid_static_profiled_async, params: {pipeline_streams: 2, pipeline_chunk_elements: 1048576}}
      - {id: hybrid_dynamic_fixed, params: {chunk_size: 1048576}}
      - {id: hybrid_dynamic_guided, params: {min_chunk_size: 262144, guided_factor: 8.0}}
      - {id: hybrid_dynamic_adaptive,
         params: {min_chunk_size: 262144, max_chunk_size: 16777216,
                  target_chunk_ms: 1.0, ema_alpha: 0.25}}
    hardware:
      cpu_core_class: all
      cpu_thread_policy: one_thread_per_core
      gpu_sets: [0]
      gpu_control_mode: dedicated
      memory_policy: interleave
