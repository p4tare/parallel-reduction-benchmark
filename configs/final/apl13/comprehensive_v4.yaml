      - {id: hybrid_static_equal_async, params: {pipeline_streams: 2, pipeline_chunks: 16, pipeline_chunk_elements: 1048576}}
      - {id: hybrid_static_profiled}
      - {id: hybrid_static_profiled_async, params: {pipeline_streams: 2, pipeline_chunks: 16, pipeline_chunk_elements: 1048576}}
      - {id: hybrid_dynamic_fixed, params: {chunk_size: 1048576}}
      - {id: hybrid_dynamic_guided, params: {min_chunk_size: 262144, guided_factor: 8.0}}
      - {id: hybrid_dynamic_adaptive, params: {min_chunk_size: 262144, max_chunk_size: 16777216, target_chunk_ms: 1.0, ema_alpha: 0.25}}
    hardware:
      cpu_core_class: all
      cpu_thread_policy: one_thread_per_core
      gpu_sets: [0]
      gpu_control_mode: dedicated
      memory_policy: interleave
      gpu_staging_numa: auto

  - id: final_v4_multi_gpu_medium
