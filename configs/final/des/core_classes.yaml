# DES-specific confirmatory study of heterogeneous Intel core classes.
# Purpose: compare P-core, E-core and mixed P+E execution under controlled, identical datasets.
# This is thesis result data, not tuning. Scheduler tunables are frozen from the independent
# all-core tuning run and deliberately kept identical across core classes to avoid confounding.
# In dedicated GPU-control mode one physical core from the selected class/pool is reserved
# for the GPU control thread and therefore removed from CPU reduction work.
output_dir: results
dataset_cache_dir: .prbench/datasets

build:
  build_dir: build
  build_type: Release
  native_cpu_tuning: true
  enable_cuda: "on"
  jobs: null
  cxx_compiler: null
  cuda_host_compiler: null

measurement:
  warmup_runs: 5
  scheduler_calibration_repetitions: 7
  scheduler_calibration_bursts: 3
  timing_repetitions: auto
  timing_probe_repetitions: 10
  timing_target_batch_seconds: 0.50
  timing_min_repetitions: 30
  timing_max_repetitions: 5000
  cache_rotation_target_bytes: 268435456
  cache_rotation_max_replicas: 1024
  energy_batch_repetitions: auto
  energy_target_batch_seconds: 3.0
  energy_min_repetitions: 10
  energy_max_repetitions: 1000000
  blocks: 7
  randomization_seed: 20260904
  max_dataset_ram_fraction: 0.60
  gpu_memory_safety_fraction: 0.80
  thermal_safety_gpu_c: 85
  thermal_safety_cpu_c: 95
  thermal_wait_timeout_s: 300
  worker_event_timeout_s: 3600
  strict_preflight: true
  max_preflight_cpu_load_percent: 5.0
  allow_gpu_graphics_processes: true

energy:
  enable_cpu: true
  enable_gpu: true
  gpu_power_fallback_poll_ms: 50

telemetry:
  enabled: true
  capture_cpu_frequency: true
  capture_cpu_temperature: true
  capture_gpu_state: true
  capture_pre_post_timing: true
  capture_pre_post_energy: true

system_baselines:
  capture_memory_inventory: true
  stream_executable: null
  stream_args: []
  stream_timeout_s: 180

experiments:
  - id: coreclass_cpu_p_physical
    operations: [sum, min, max]
    datasets: &coreclass_datasets
      - {size: 10000000, dtype: int64, distribution: integers, seed: 40201, low: -1000000, high: 1000000}
      - {size: 100000000, dtype: int64, distribution: integers, seed: 40201, low: -1000000, high: 1000000}
      - {size: 10000000, dtype: float32, distribution: uniform, seed: 40301, low: -1.0, high: 1.0,
         quantization: {mode: binary_fraction, bits: 8}}
      - {size: 100000000, dtype: float32, distribution: uniform, seed: 40301, low: -1.0, high: 1.0,
         quantization: {mode: binary_fraction, bits: 8}}
    algorithms:
      - {id: cpu_omp}
      - {id: cpu_omp_simd}
    hardware:
      cpu_core_class: performance
      cpu_thread_policy: one_thread_per_core
      gpu_sets: [0]
      gpu_control_mode: dedicated
      memory_policy: interleave

  - id: coreclass_cpu_p_smt
    operations: [sum, min, max]
    datasets: *coreclass_datasets
    algorithms:
      - {id: cpu_omp}
      - {id: cpu_omp_simd}
    hardware:
      cpu_core_class: performance
      cpu_thread_policy: all_threads
      gpu_sets: [0]
      gpu_control_mode: dedicated
      memory_policy: interleave

  - id: coreclass_cpu_e
    operations: [sum, min, max]
    datasets: *coreclass_datasets
    algorithms:
      - {id: cpu_omp}
      - {id: cpu_omp_simd}
    hardware:
      cpu_core_class: efficiency
      cpu_thread_policy: one_thread_per_core
      gpu_sets: [0]
      gpu_control_mode: dedicated
      memory_policy: interleave

  - id: coreclass_cpu_all_physical
    operations: [sum, min, max]
    datasets: *coreclass_datasets
    algorithms:
      - {id: cpu_omp}
      - {id: cpu_omp_simd}
    hardware:
      cpu_core_class: all
      cpu_thread_policy: one_thread_per_core
      gpu_sets: [0]
      gpu_control_mode: dedicated
      memory_policy: interleave

  - id: coreclass_cpu_all_threads
    operations: [sum, min, max]
    datasets: *coreclass_datasets
    algorithms:
      - {id: cpu_omp}
      - {id: cpu_omp_simd}
    hardware:
      cpu_core_class: all
      cpu_thread_policy: all_threads
      gpu_sets: [0]
      gpu_control_mode: dedicated
      memory_policy: interleave

  - id: coreclass_hybrid_p
    operations: [sum, min, max]
    datasets: *coreclass_datasets
    algorithms: &coreclass_hybrid_algorithms
      - {id: hybrid_static_equal}
      - {id: hybrid_static_profiled}
      - {id: hybrid_static_profiled_async, params: {pipeline_streams: 4, pipeline_chunk_elements: 4194304}}
      - {id: hybrid_dynamic_adaptive,
         params: {min_chunk_size: 65536, max_chunk_size: 16777216,
                  target_chunk_ms: 2.0, ema_alpha: 0.25}}
    hardware:
      cpu_core_class: performance
      cpu_thread_policy: one_thread_per_core
      gpu_sets: [0]
      gpu_control_mode: dedicated
      memory_policy: interleave

  - id: coreclass_hybrid_e
    operations: [sum, min, max]
    datasets: *coreclass_datasets
    algorithms: *coreclass_hybrid_algorithms
    hardware:
      cpu_core_class: efficiency
      cpu_thread_policy: one_thread_per_core
      gpu_sets: [0]
      gpu_control_mode: dedicated
      memory_policy: interleave

  - id: coreclass_hybrid_all
    operations: [sum, min, max]
    datasets: *coreclass_datasets
    algorithms: *coreclass_hybrid_algorithms
    hardware:
      cpu_core_class: all
      cpu_thread_policy: one_thread_per_core
      gpu_sets: [0]
      gpu_control_mode: dedicated
      memory_policy: interleave
