# DES V4 REUSE + TRANSFER-CHUNK + P/E-CORE CAMPAIGN
# Machine family: DES single-GPU heterogeneous Intel CPU (P-cores + E-cores).
#
# This is the single-GPU counterpart of configs/final/apl13/comprehensive_reuse_chunks_v4.yaml.
# The main research extension on DES is explicit P-core vs E-core comparison for CPU and
# CPU+GPU hybrid reductions. Multi-GPU-only groups are omitted because DES has one GPU.
#
# DES-specific tunables are retained from the previous frozen DES campaigns:
#   legacy GPU blocks: global=128, shared=128, warp=256, two_pass=256
#   async: 4 streams, baseline chunk=4,194,304 elements
#   dynamic fixed: 16,777,216 elements
#   guided: min=1,048,576, factor=4
#   adaptive: min=65,536, max=16,777,216, target=2 ms, alpha=0.25
#
# The measurement protocol follows the current apl13 follow-up so cross-machine results
# can be analysed with the same timing/energy semantics. DES keeps its known platform
# exception: a graphics process on the single GPU is allowed and must remain constant.
#
# Canonical practical reuse sweep:
#   K=[1,2,3,4,5,10,15,20,21,22,25,30,50,100]
#
# Chunk sensitivity:
#   N=1e8 float32 SUM: 1, 4, 16, 64, 256 MiB
#   4 GiB float32 SUM: 256, 512 MiB, 1, 2, 4 GiB

output_dir: results/des_reuse_chunks_coreclasses_v4
dataset_cache_dir: .prbench/datasets

sweeps:
  reuse_count: [1, 2, 3, 4, 5, 10, 15, 20, 21, 22, 25, 30, 50, 100]

build:
  build_dir: build
  build_type: Release
  native_cpu_tuning: true
  enable_cuda: "on"
  jobs: null
  cxx_compiler: null
  cuda_host_compiler: null

measurement:
  warmup_runs: 2
  scheduler_calibration_repetitions: 3
  scheduler_calibration_bursts: 1
  timing_repetitions: auto
  timing_probe_repetitions: 3
  timing_target_batch_seconds: 0.50
  timing_min_repetitions: 5
  timing_max_repetitions: 100
  cache_rotation_target_bytes: 134217728
  cache_rotation_max_replicas: 256
  energy_batch_repetitions: auto
  energy_target_batch_seconds: 3.0
  energy_min_repetitions: 1
  energy_max_repetitions: 200
  blocks: 3
  randomization_seed: 20261007
  max_dataset_ram_fraction: 0.60
  max_dataset_storage_fraction_of_free: 0.90
  gpu_memory_safety_fraction: 0.80
  thermal_safety_gpu_c: 85
  thermal_safety_cpu_c: 95
  thermal_wait_timeout_s: 300
  worker_event_timeout_s: 7200
  strict_preflight: true
  max_preflight_cpu_load_percent: 5.0
  allow_gpu_graphics_processes: true

energy:
  enable_cpu: true
  enable_gpu: true
  gpu_power_fallback_poll_ms: 50

telemetry:
  enabled: true
  capture_cpu_frequency: true
  capture_cpu_temperature: true
  capture_gpu_state: true
  capture_pre_post_timing: true
  capture_pre_post_energy: true

system_baselines:
  capture_memory_inventory: true
  stream_executable: null
  stream_args: []
  stream_timeout_s: 180

experiments:
  # ---------------------------------------------------------------------------
  # A. COMMON CORE MATRIX + P/E CORE CLASSES
  #    Same datasets for all classes: 4 dtypes x 4 N x 3 operations.
  # ---------------------------------------------------------------------------
  - id: des_v4_cpu_all_reference
    operations: [sum, min, max]
    datasets: &core_datasets
      - &i32_1e5 {size: 100000, dtype: int32, distribution: integers, seed: 60101, low: -1, high: 1}
      - &i32_1e6 {size: 1000000, dtype: int32, distribution: integers, seed: 60101, low: -1, high: 1}
      - &i32_1e7 {size: 10000000, dtype: int32, distribution: integers, seed: 60101, low: -1, high: 1}
      - &i32_1e8 {size: 100000000, dtype: int32, distribution: integers, seed: 60101, low: -1, high: 1}

      - &i64_1e5 {size: 100000, dtype: int64, distribution: integers, seed: 60201, low: -1000000, high: 1000000}
      - &i64_1e6 {size: 1000000, dtype: int64, distribution: integers, seed: 60201, low: -1000000, high: 1000000}
      - &i64_1e7 {size: 10000000, dtype: int64, distribution: integers, seed: 60201, low: -1000000, high: 1000000}
      - &i64_1e8 {size: 100000000, dtype: int64, distribution: integers, seed: 60201, low: -1000000, high: 1000000}

      - &f32_1e5 {size: 100000, dtype: float32, distribution: uniform, seed: 60301, low: -1.0, high: 1.0, quantization: {mode: binary_fraction, bits: 8}}
      - &f32_1e6 {size: 1000000, dtype: float32, distribution: uniform, seed: 60301, low: -1.0, high: 1.0, quantization: {mode: binary_fraction, bits: 8}}
      - &f32_1e7 {size: 10000000, dtype: float32, distribution: uniform, seed: 60301, low: -1.0, high: 1.0, quantization: {mode: binary_fraction, bits: 8}}
      - &f32_1e8 {size: 100000000, dtype: float32, distribution: uniform, seed: 60301, low: -1.0, high: 1.0, quantization: {mode: binary_fraction, bits: 8}}

      - &f64_1e5 {size: 100000, dtype: float64, distribution: uniform, seed: 60401, low: -1.0, high: 1.0, quantization: {mode: binary_fraction, bits: 16}}
      - &f64_1e6 {size: 1000000, dtype: float64, distribution: uniform, seed: 60401, low: -1.0, high: 1.0, quantization: {mode: binary_fraction, bits: 16}}
      - &f64_1e7 {size: 10000000, dtype: float64, distribution: uniform, seed: 60401, low: -1.0, high: 1.0, quantization: {mode: binary_fraction, bits: 16}}
      - &f64_1e8 {size: 100000000, dtype: float64, distribution: uniform, seed: 60401, low: -1.0, high: 1.0, quantization: {mode: binary_fraction, bits: 16}}
    algorithms:
      - {id: cpu_seq}
      - {id: cpu_omp_simd}
    hardware:
      cpu_core_class: all
      cpu_thread_policy: one_thread_per_core
      gpu_sets: []
      gpu_control_mode: dedicated
      memory_policy: interleave
      gpu_staging_numa: auto

  - id: des_v4_cpu_all_threads
    operations: [sum, min, max]
    datasets: *core_datasets
    algorithms:
      - {id: cpu_omp}
    hardware:
      cpu_core_class: all
      cpu_thread_policy: all_threads
      gpu_sets: []
      gpu_control_mode: dedicated
      memory_policy: interleave
      gpu_staging_numa: auto

  - id: des_v4_cpu_p_physical
