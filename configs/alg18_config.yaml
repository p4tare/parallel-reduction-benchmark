global:
  output_dir: "./results"
  enable_rapl: true
  enable_nvml: true
  enable_perf: false
  polling_interval_ms: 10
  cooling_threshold_gpu_c: 100.0
  cooling_threshold_cpu_c: 100.0
  orchestrator_core_isolation: true

experiments:
  - id: "EXP_018_CROSS_SOCKET_P2P"
    algorithm_path: "algorithms/macro_dynamic/exp_018_cross_socket_p2p"
    compiler_flags: "auto"
    repetitions: 20
    warmup_runs: 3
    data:
      sizes: [100000000]
      types: ["int32", "float32_4", "double"] 
      generation_mode: ["ones", "0+-2", "0+-4_binary"]
    hardware:
      gpu_allocation: ["all"] 
      cpu_allocation_strategy: ["all", "p_cores_only", "e_cores_only", "physical_cores_only"]
      use_dedicated_gpu_threads: [true, false]
      cuda_block_sizes: [32, 1024]
