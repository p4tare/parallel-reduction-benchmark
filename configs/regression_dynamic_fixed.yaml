# Regression test for the v2.2 dynamic_fixed calibration/capacity bug.
output_dir: results
build:
  build_dir: build
  build_type: Release
  native_cpu_tuning: true
  enable_cuda: "on"
measurement:
  warmup_runs: 2
  timing_repetitions: 5
  energy_batch_repetitions: auto
  energy_target_batch_seconds: 1.0
  energy_min_repetitions: 5
  energy_max_repetitions: 1000
  blocks: 1
  randomization_seed: 23003
  max_dataset_ram_fraction: 0.2
  thermal_safety_gpu_c: 90
  thermal_safety_cpu_c: 95
  worker_event_timeout_s: 1800
  thermal_wait_timeout_s: 60
energy:
  enable_cpu: false
  enable_gpu: false
experiments:
  - id: dynamic_fixed_regression
    datasets:
      - {size: 1048576, dtype: float32, distribution: symmetric_uniform, seed: 7, low: -1.0, high: 1.0, quantization: {mode: binary_fraction, bits: 8}}
      - {size: 100000000, dtype: float32, distribution: symmetric_uniform, seed: 7, low: -1.0, high: 1.0, quantization: {mode: binary_fraction, bits: 8}}
    algorithms:
      - {id: hybrid_dynamic_fixed, params: {chunk_size: [65536, 131072, 262144, 524288, 1048576, 4194304]}}
    hardware:
      cpu_core_class: all
      cpu_thread_policy: all_threads
      gpu_sets: [each]
      gpu_control_mode: dedicated
      memory_policy: interleave
