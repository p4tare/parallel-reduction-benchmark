global:
  output_dir: "./results"
  enable_rapl: true
  enable_nvml: true
  enable_perf: false
  polling_interval_ms: 10
  cooling_threshold_gpu_c: 100.0
  cooling_threshold_cpu_c: 100.0
  orchestrator_core_isolation: true

experiments:
  - id: "EXP_016"
    algorithm_path: "algorithms/macro_dynamic/exp_016_distributed_work_stealing"
    compiler_flags: "auto"
    repetitions: 10
    warmup_runs: 2
    data:
      sizes: [1000]
      types: ["float32_6"] 
      generation_mode: ["0+-1_binary"]
    hardware:
      gpu_allocation: ["all"] 
      cpu_allocation_strategy: ["all", "p_cores_only", "physical_cores_only"]
      use_dedicated_gpu_threads: [true, false]
      cuda_block_sizes: [32, 1024]