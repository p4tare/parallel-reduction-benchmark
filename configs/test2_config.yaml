global:
  output_dir: "./results"
  enable_rapl: true
  enable_nvml: true
  enable_perf: false
  polling_interval_ms: 10
  cooling_threshold_gpu_c: 50.0
  cooling_threshold_cpu_c: 80.0
  orchestrator_core_isolation: true

experiments:
  - id: "EXP_001_CUDA_ATOMICS"
    algorithm_path: "algorithms/gpu_single/exp_001_cuda_atomics"
    compiler_flags: "auto"
    repetitions: 50
    warmup_runs: 5
    data:
      sizes: [500000000]
      types: ["int32", "float32"]
      generation_mode: "random_uniform"
    hardware:
      gpu_allocation: "0"
      cpu_allocation_strategy: ["all"]
      use_dedicated_gpu_threads: [true, false]
      cuda_block_sizes: [512]

  - id: "EXP_012_STATIC_EQUAL_HYBRID"
    algorithm_path: "algorithms/hybrid/exp_012_static_equal"
    compiler_flags: "-Xcompiler -fopenmp"
    repetitions: 50
    warmup_runs: 5
    data:
      sizes: [500000000]
      types: ["int32", "float32"]
      generation_mode: "random_uniform"
    hardware:
      gpu_allocation: "0"
      cpu_allocation_strategy: ["physical_cores_only", "all"]
      use_dedicated_gpu_threads: [true, false]
      cuda_block_sizes: [512]