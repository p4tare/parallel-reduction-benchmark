[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parallel-reduction-benchmark"
version = "3.0.0"
description = "Research-grade CPU/GPU parallel reduction benchmarking framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0,<3",
  "psutil>=5.9,<8",
  "PyYAML>=6.0,<7",
  "pydantic>=2.8,<3",
  "nvidia-ml-py>=12.0,<14; platform_system == 'Linux'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<7",
  "ruff>=0.9,<1",
  "mypy>=1.11,<2",
  "types-PyYAML>=6.0",
]

[project.scripts]
prbench = "prbench.cli:main"

[tool.setuptools.packages.find]
include = ["prbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true

[tool.setuptools.package-data]
prbench = ["data/*.yaml"]
